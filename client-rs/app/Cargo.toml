[package]
name = "bsk-client"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "betterskillys"
path = "src/main.rs"

[dependencies]
rustc-hash.workspace = true
ab_glyph = "0.2"
bsk-assets.workspace = true
bsk-data.workspace = true
bsk-net.workspace = true
bsk-proto.workspace = true
bsk-render.workspace = true
bsk-session.workspace = true
bsk-update.workspace = true
bsk-world.workspace = true
futures.workspace = true
image.workspace = true
log.workspace = true
# Sound effects and music (MP3, as the account server serves them).
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "mp3"] }
serde.workspace = true
serde_json.workspace = true
web-time.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# The clipboard, for copying and pasting in text fields.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
pollster.workspace = true
# Updates: downloading releases and unpacking their files.
flate2 = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
console_log.workspace = true
# Web Audio in the browser.
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "mp3", "wasm-bindgen"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "Location", "Storage", "Navigator", "Clipboard", "ClipboardEvent", "DataTransfer", "EventTarget", "Event", "KeyboardEvent"] }

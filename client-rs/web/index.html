<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do Damage</title>
  <!-- Start both downloads at once, rather than the module only once the page's script runs and
       the game only once the module has arrived. -->
  <link rel="modulepreload" href="./betterskillys.js?v=BSK_JS_VERSION">
  <link rel="preload" href="./betterskillys_bg.wasm?v=BSK_WASM_VERSION" as="fetch" type="application/wasm" crossorigin>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0716; overflow: hidden; font: 15px system-ui, sans-serif; color: #cfc6e6; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    /* The loading screen, in the game's look (theme.rs): a night sky, violet glass, ember. */
    #loader {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
      background: radial-gradient(ellipse at 50% 120%, #3a1d4f 0%, #1a0f2e 45%, #0b0716 100%);
      transition: opacity .4s ease;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #card { width: min(440px, calc(100vw - 32px)); text-align: center; }
    #title {
      font: 900 clamp(34px, 9vw, 60px)/1 "Courier New", monospace; letter-spacing: .08em;
      background: linear-gradient(#ffe28a, #ff9a3c 55%, #c8431c); -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 4px 0 rgba(0, 0, 0, .35);
    }
    #track {
      margin: 28px 0 12px; height: 12px; border-radius: 6px; overflow: hidden;
      background: rgba(120, 90, 170, .25); border: 1px solid rgba(170, 140, 220, .35);
    }
    /* no transition: the game keeps the page busy while it loads, and the bar would lag */
    #bar { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #ff9a3c, #ffcf6b); }
    #track.busy #bar { width: 100%; animation: pulse 1.2s ease-in-out infinite; }
    #track.failed #bar { width: 100%; background: #e0505a; }
    @keyframes pulse { 50% { opacity: .45; } }
    #text { min-height: 1.4em; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="loader">
    <div id="card">
      <div id="title">DO DAMAGE</div>
      <div id="track"><div id="bar"></div></div>
      <div id="text">Starting…</div>
    </div>
  </div>
  <script type="module">
    // The client draws its own screens. A page may set window.bskLogin = {email, password}
    // before init() to sign in straight away (see client-rs/app/src/login.rs).
    // ?v=: a hash of each file (filled in by build_client_rs.py), so a browser never mixes in
    // files it kept from an older build, and keeps the ones that haven't changed across builds;
    // the gateway lets browsers keep ?v= files for good. The game asks for its art and data the
    // same way (their hashes are in the manifest, whose own hash is this).
    import init from "./betterskillys.js?v=BSK_JS_VERSION";
    window.bskManifestVersion = "BSK_MANIFEST_VERSION";
    // What the first visit downloads (build_client_rs.py fills these in): the game, then its
    // art and data, which the game reports file by file (window.bskAssetLoaded).
    const WASM_BYTES = Number("BSK_WASM_BYTES") || 0;
    const ASSET_BYTES = Number("BSK_ASSET_BYTES") || 0;
    const total = WASM_BYTES + ASSET_BYTES;
    const loader = document.getElementById("loader");
    const track = document.getElementById("track");
    const bar = document.getElementById("bar");
    const text = document.getElementById("text");
    let got = 0;
    const mb = (n) => (n / 1e6).toFixed(1);
    function show() {
      if (got >= total || !total) {
        track.classList.add("busy");
        text.textContent = "Getting ready…";
        return;
      }
      bar.style.width = (100 * got / total).toFixed(1) + "%";
      text.textContent = `Downloading the game… ${mb(got)} of ${mb(total)} MB`;
    }
    window.bskAssetLoaded = (n) => { got += n; show(); };
    // The game's first frame is ready: the loading screen goes.
    window.bskReady = () => {
      console.info(`ready in ${Math.round(performance.now())} ms`);
      loader.classList.add("done");
      setTimeout(() => loader.remove(), 450);
    };

    // The wasm module, counted on the bar as it arrives (it's most of a first visit) while the
    // browser compiles it. The count reads a copy: the game gets the browser's own response, so
    // the browser also keeps the compiled module and needn't compile it again on the next visit.
    async function fetchWasm(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const copy = response.clone();
      if (copy.body) {
        (async () => {
          const reader = copy.body.getReader();
          for (;;) {
            const { done, value } = await reader.read();
            if (done) return;
            got += value.length;
            show();
          }
        })().catch(() => {});
      }
      return response;
    }

    // Browser play moved from dodmg.com/play to play.dodmg.com (2026-11-07), and browsers keep
    // saved data per address. Once, before the game reads them, take over the settings and the
    // remembered login kept for the old one: its storage-handover.html, in a hidden frame (the
    // same site, so it sees that storage), posts them here. The old settings win over any made
    // here meanwhile; a login or guest here stays. On another address (one without a parent
    // domain, http) nothing happens.
    async function takeOver() {
      const PREFIX = "betterSkillys-rs.";
      const DONE = PREFIX + "handover";
      let store;
      try { store = window.localStorage; } catch (e) { return; }
      const parts = location.hostname.split(".");
      const local = location.hostname.endsWith(".localhost"); // a test: play.bsk.localhost
      if (!store || store.getItem(DONE) || (location.protocol !== "https:" && !local) || parts.length < 3) return;
      const from = location.protocol + "//" + parts.slice(1).join(".") + (location.port ? ":" + location.port : "");
      const frame = document.createElement("iframe");
      const data = await new Promise((resolve) => {
        const timer = setTimeout(() => finish(null), 3000);
        function finish(d) {
          clearTimeout(timer);
          window.removeEventListener("message", heard);
          frame.remove();
          resolve(d);
        }
        function heard(e) {
          if (e.origin === from && e.source === frame.contentWindow) finish(e.data);
        }
        window.addEventListener("message", heard);
        frame.style.display = "none";
        frame.src = from + "/storage-handover.html";
        document.body.appendChild(frame);
      });
      if (!data || data.bskHandover !== 1 || typeof data.items !== "object") return; // try again next time
      for (const [key, value] of Object.entries(data.items)) {
        if (typeof value !== "string" || !key.startsWith(PREFIX)) continue;
        if (key === PREFIX + "settings" || store.getItem(key) === null) store.setItem(key, value);
      }
      store.setItem(DONE, "1");
    }

    try {
      show();
      const download = fetchWasm("./betterskillys_bg.wasm?v=BSK_WASM_VERSION");
      try { await takeOver(); } catch (e) { console.warn("taking over the old settings:", e); }
      const wasm = await download;
      await init({ module_or_path: wasm });
    } catch (err) {
      track.classList.remove("busy");
      track.classList.add("failed");
      text.textContent = "The game couldn't load (" + err + "). Reload the page to try again.";
    }
  </script>
</body>
</html>
